
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Swapping Project</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Swapping Project</h1>

    <div class="container">

        <div class="card">
            <img id="img1"
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=400"
            alt="Nature">

            <button onclick="swapPic('img1', 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400')">
                Change Image 1
            </button>
        </div>

        <div class="card">
            <img id="img2"
            src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=400"
            alt="Night Sky">

            <button onclick="swapPic('img2', 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=400')">
                Change Image 2
            </button>
        </div>

        <div class="card">
            <img id="img3"
            src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400"
            alt="Mountain">

            <button onclick="swapPic('img3', 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400')">
                Change Image 3
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
